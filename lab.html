<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동작 확인</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #072A66; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// 동작 확인용 화면: 캐릭터 하나에 동작 하나를 얹어 본다.
//   lab.html?clip=이름&mirror=0|1&far=0|1&cam=game|side|front   (내 선수의 옆으로 가는 동작은 게임처럼 옆 레인까지 옮겨 가며 보여 준다.
//   far=1 은 공이 가는 쪽의 반대편에 있을 때의 것이다: 반대 발로 공을 모는 달리기 위에 얹는다)
//   window.__lab = { ready, clips, scenes, at(u) }: at(u) 는 저절로 돌던 것을 멈추고 동작의 u(0..1) 시점을 그린다
// 막는 선수는 게임의 그리기 조각을 그대로 쓴다: 막는 것 몇 개만 놓은 판을 규칙대로 돌려 본다.
//   lab.html?who=def&clip=stand|idle|pass|beat|hit|shift|rush|slide1|slide2|slide1r|slide2r|jump|keeper|knock|flop&cam=front|side|top|game
import * as THREE from './js/render/three.js';
import { JUMP_H, TICK, SPEED0 } from './js/sim/constants.js';
import { createRun, step } from './js/sim/run.js';
import { makeStand, makeShift, makeRush, makeSlide, makeKeeper } from './js/sim/objects.js';
import { kitById } from './js/data/kits.js';
import * as daynight from './js/render/daynight.js';
import * as stadium from './js/render/stadium.js';
import { makeRig } from './js/render/rig.js';
import * as defenders from './js/render/defenders.js';
import { apply, layer, mirror, sample } from './js/render/anim.js';
import { RUN, CLIPS as HERO, BALL_R } from './js/render/clips-hero.js';
import { settle, gone } from './js/render/clip-tools.js';
import { JOCKEY, LIE_BACK, LIE_SIDE, CLIPS as DEF } from './js/render/clips-def.js';

const params = new URLSearchParams(location.search);
const name = params.get('clip') || 'run', flip = params.get('mirror') === '1', far = params.get('far') === '1';

// 이름 → { dur, pose(u), who, path?(u) }. 내 선수의 동작은 게임에서처럼 달리기 위에 얹는다.
// 막는 선수의 동작은 골반이 가는 길(path)을 따로 적으므로, 게임에서처럼 그 길에 몸을 놓는다
const end = clip => () => ({ ...clip.path.keys.at(-1).root, x: 0, z: 0 });   // 동작이 끝나 누운 몸을 제자리에 옮겨 놓고 본다
const RUN_HZ = 1.7, pose = {
  run: { dur: 1 / RUN_HZ, pose: u => RUN(u * Math.PI * 2), who: 'hero' },
  jockey: { dur: 2, pose: u => JOCKEY(u * 2), who: 'def' },
  lieBack: { dur: 1, pose: () => LIE_BACK, path: end(DEF.knocked), who: 'def' },
  lieSide: { dur: 1, pose: () => LIE_SIDE, path: end(DEF.save), who: 'def' },
};
// 게임(hero.js)처럼 동작이 끝나는 순간의 걸음을 맞춰 두고, 섞은 자세의 발이 잔디 밑으로 내려가면 골반을 올린다
const LAND = 1.5 * Math.PI, STILL = ['rainbow', 'kick', 'tackled'];   // STILL: 옆 레인으로 가지 않는 동작
const base = phase => { const p = far ? mirror(RUN(phase + Math.PI)) : RUN(phase); return flip ? mirror(p) : p; };
for (const [k, clip] of Object.entries(HERO)) {
  const c = far && clip.far || clip;
  pose[k] = { dur: c.dur, who: 'hero', side: !STILL.includes(k), pose: u => (c.loop ? sample(c, u) : settle(layer(base(LAND - (1 - u) * c.dur * RUN_HZ * Math.PI * 2), c, u, flip))) };
}
for (const [k, c] of Object.entries(DEF)) pose[k] = { dur: c.dur, who: 'def', pose: u => layer(JOCKEY(u * c.dur), c, u, flip), path: u => sample(c.path, u).root };
const AIRBORNE = ['rainbow'];   // 규칙이 몸을 띄우는 동작. 여기서는 같은 포물선을 흉내 낸다

// 막는 선수 장면. objs: 놓을 것(첫째를 카메라가 따라간다), ticks: 돌릴 틱 수, cmds: { 틱: 입력 }, x: 카메라가 보는 가로 자리
const tickAt = m => Math.round(m / (SPEED0 * TICK));   // 내 선수가 m 만큼 달린 틱. 입력은 거리로 적어야 빠르기가 바뀌어도 장면이 맞는다
const SCENES = {
  stand: { ticks: 120, x: 0, objs: () => [makeStand(1, 14, 1), makeStand(2, 14, 3), makeStand(3, 14, 0)] },
  idle: { ticks: 150, x: 0, objs: () => [makeStand(1, 45, 2), makeStand(2, 45, 3), makeStand(3, 45, 1)] },
  pass: { ticks: 130, x: -1.5, objs: () => [makeStand(1, 14, 1)] },
  beat: { ticks: 150, x: 0, cmds: { [tickAt(12)]: 'R' }, objs: () => [makeStand(1, 14, 2), makeStand(2, 14, 0)] },
  hit: { ticks: 150, x: 0, objs: () => [makeStand(1, 12, 2)] },
  shift: { ticks: 110, x: 0, objs: () => [makeShift(1, 20, 1, 3, 110)] },
  rush: { ticks: 215, x: -1.5, objs: () => [makeRush(1, 40, 1)] },
  slide1: { ticks: 235, x: -1.5, objs: () => [makeSlide(1, 34, 1, 1)] },
  slide2: { ticks: 235, x: -2.25, objs: () => [makeSlide(1, 34, 0, 2)] },
  slide1r: { ticks: 235, x: 1.5, objs: () => [makeSlide(1, 34, 3, 1)] },
  slide2r: { ticks: 235, x: 2.25, objs: () => [makeSlide(1, 34, 3, 2)] },
  jump: { ticks: 250, x: 0, cmds: { [tickAt(31.7)]: 'U' }, objs: () => [makeSlide(1, 34, 2, 1)] },
  keeper: { ticks: 215, x: 0.75, cmds: { [tickAt(25)]: 'L' }, objs: () => [makeKeeper(1, 30, 1, 1)] },
  knock: { ticks: 110, x: 0, objs: () => [makeStand(1, 14, 3), makeStand(2, 14, 1), makeStand(3, 14, 2)].map(o => ({ ...o, knockAt: 30 })) },
  flop: { ticks: 170, x: 0, objs: () => [makeKeeper(1, 26, 3, -1), makeSlide(2, 26, 0, 1), makeSlide(3, 32, 3, 2)].map(o => ({ ...o, knockAt: 130 })) },
};
const staged = params.get('who') === 'def' ? SCENES[name] : null;
const picked = staged ? { dur: staged.ticks * TICK, who: 'hero' } : pose[name] || pose.run;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(40, 1, 0.5, 300);
const ctx = { THREE, scene, camera, renderer, quality: 'high', time: null, mode: 'run', now: 0, blob() {} };
const still = { dist: 0, pdist: 0 };
for (const piece of [daynight.create(ctx), stadium.create(ctx)]) piece.update(still, 1, 0);

const CAMS = { game: [62, [0, 3.6, 5.2], [0, 0.1, -7]], side: [40, [4.6, 1.3, -0.3], [0, 0.85, -0.3]], front: [40, [0, 1.4, -4.8], [0, 0.85, 0]] };
// 막는 선수를 따라가며 보는 자리: 앞(내 선수 쪽), 옆, 위
// 옆에서 보는 자리는 광고판 안쪽에 있도록 가까운 터치라인 반대편에 둔다
const DEF_CAMS = { front: [40, [0, 1.5, 6], [0, 0.8, 0]], side: [46, [staged && staged.x > 0 ? -4.8 : 4.8, 1.3, 0.2], [0, 0.8, 0]], top: [40, [0, 9, 0.01], [0, 0, 0]] };
const follow = staged && DEF_CAMS[params.get('cam')];
const [fov, from, to] = follow || CAMS[params.get('cam')] || CAMS.game;
camera.fov = fov; camera.position.set(...from); camera.lookAt(...to);

const rig = picked.who === 'hero'
  ? makeRig({ kit: kitById('home'), no: 10, name: '이동경' })
  : makeRig({ kit: kitById('away'), no: 19 });
scene.add(rig.root);
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 20, 14), new THREE.MeshLambertMaterial({ color: '#f7f7f2' }));
ball.castShadow = true;
scene.add(ball);

// 장면을 처음부터 u 시점까지 규칙대로 돌린 뒤 그린다
const piece = staged && defenders.create(ctx);
function drawStaged(u) {
  const run = createRun(1), n = Math.round(u * staged.ticks);
  run.track = null; run.objs = staged.objs();
  const first = run.objs[0];
  piece.reset(run);
  ctx.now = 0;
  for (let i = 0; i < n; i++) {
    if (run.alive) {
      const events = step(run, staged.cmds && staged.cmds[i] ? [staged.cmds[i]] : []);
      ctx.now = (run.tick - 1) * TICK;
      for (const ev of events) piece.onEvent(ev, run);
    }
    ctx.now += TICK;
    piece.update(run, 1, TICK);
  }
  if (n === 0) piece.update(run, 1, 0);
  apply(rig, RUN(ctx.now * RUN_HZ * Math.PI * 2));
  rig.root.position.set(run.x, run.y, 0);
  rig.root.visible = run.alive && params.get('cam') !== 'front';   // 앞에서 볼 때는 내 선수가 가린다
  ball.visible = false;
  if (follow) {
    const x = staged.x, z = run.dist - first.d;
    camera.position.set(x + from[0], from[1], z + from[2]); camera.lookAt(x + to[0], to[1], z + to[2]);
  }
  renderer.render(scene, camera);
}

const up = new THREE.Vector3();
function draw(u) {
  if (staged) return drawStaged(u);
  const p = picked.pose(u);
  apply(rig, p);
  rig.root.position.y = AIRBORNE.includes(name) ? JUMP_H * 4 * u * (1 - u) : 0;
  // 옆으로 가는 동작은 규칙이 옮기는 만큼 몸을 옮긴다. 게임 카메라는 게임처럼 일부만, 옆·앞 카메라는 다 따라간다(옆 카메라는 광고판 안쪽에 남게 가는 쪽 반대편에 둔다)
  const dir = flip ? -1 : 1, x = picked.side ? dir * gone(u * picked.dur) : 0;
  if (picked.side) {
    const k = from === CAMS.game[1] ? 0.62 : 1, far = from === CAMS.side[1] ? -dir : 1;
    rig.root.position.x = x;
    camera.position.x = far * from[0] + x * k; camera.lookAt(to[0] + x * k * (k < 1 ? 0.92 : 1), to[1], to[2]);
  }
  if (picked.path) {
    // 게임의 막는 선수는 이쪽을 보고 선다. 여기서는 내 선수처럼 등을 보이게 반 바퀴 돌려 놓는다
    const w = picked.path(u), dir = flip ? -1 : 1;
    rig.root.rotation.set(w.pitch, dir * w.yaw, dir * w.roll, 'YXZ');
    rig.root.position.set(-dir * w.x, w.y, -w.z).addScaledVector(up.set(0, 1, 0).applyEuler(rig.root.rotation), -w.y);
  }
  ball.visible = !!p.ball;
  if (p.ball) ball.position.set(x + p.ball.x, p.ball.y, p.ball.z);
  renderer.render(scene, camera);
}

function fit() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', fit);
fit();

let playing = true;
const t0 = performance.now();
(function loop(now) {
  if (!playing) return;
  draw(((now - t0) / 1000 / picked.dur) % 1);
  requestAnimationFrame(loop);
})(t0);

window.__lab = { ready: true, clips: Object.keys(pose), scenes: Object.keys(SCENES), at(u) { playing = false; draw(u); } };
</script>
</body>
</html>
